name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-lint:
    name: Python parse (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify every .py file parses
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import ast, sys, pathlib
          root = pathlib.Path(".")
          skip_dirs = {".git", "venv", ".venv", "node_modules", "__pycache__", "third_party", ".models"}
          bad = []
          for p in root.rglob("*.py"):
              if any(part in skip_dirs for part in p.parts):
                  continue
              try:
                  ast.parse(p.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("Syntax errors:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("All .py files parse OK")
          PY

  requirements-resolve:
    name: pip resolve (${{ matrix.os }}, ${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build: [cpu, cuda]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Dry-run pip resolve for requirements-${{ matrix.build }}.txt
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          # --dry-run resolves the full graph without downloading the world.
          # It catches wheel-availability regressions on either OS.
          pip install --dry-run -r requirements-${{ matrix.build }}.txt -r requirements.txt

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web
        run: npm run lint --if-present

  launcher-parse:
    name: Launcher script parse
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Parse launch.sh (bash -n)
        if: runner.os == 'Linux'
        run: bash -n launch.sh

      - name: Parse launch.ps1 (AST tokens)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "launch.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "launch.ps1 parses OK"
